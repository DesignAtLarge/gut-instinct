<template name="trial">
    <!-- Welcome Message -->
    {{#unless isTaken type}}
    <div class="progress"
        style="position: fixed; top:-20px; width: 100%; height: 80px; background-color: #01579B; z-index: 100;">
        <h4 id="trialProgress" style="text-align: center; margin-top: 30px; color: white;">Gut Check 0% Complete</h4>
    </div>
    {{/unless}}

    <div class="container content topics" style="max-width: 750px; margin-bottom: 200px;">
        {{#if isTaken type}}
        <h4 class="animated fadeIn light-blue-text text-darken-4" style="margin-top: 50%;">Thank you for answering our
            questions!</h4>
        <br />
        {{#unless isCondition5}}
        <h5 class="animated fadeIn light-blue-text text-darken-4">
            Go back to <a href="/entrance" class="light-blue-text text-darken-4" style="text-decoration: underline;">Gut
                Instinct</a>
        </h5>
        {{else}}
        <h5 class="animated fadeIn light-blue-text text-darken-4">
            Learn more about your gut <a href="/topics" class="light-blue-text text-darken-4"
                style="text-decoration: underline;">here!</a>
        </h5>
        {{/unless}}
        {{else}}
        <h4 class="animated fadeIn light-blue-text text-darken-4">How much do you know about your gut?</h4>
        <br />
        <!-- Uncomment this line if needed: <h4 id="trialProgress" class='animated fadeIn light-blue-text text-darken-4' style=''>0% Complete</h4> -->
        <br />
        {{#if isPre type}}
        <h6 class="timestamp" style="font-size: 12pt;">
            You must complete this quick check before accessing complete Gut Instinct
        </h6>
        {{else}}
        <h6 class="timestamp" style="font-size: 12pt; text-align: left;">
            Complete this quick check and survey to enter a raffle to win an American Gut Project kit. Using an American
            Gut kit you (or a friend/family member) can take samples from your body and learn about your own gut
            microbiome! <br><br>This check will close in <strong style="color: red;">{{getHours}} hours - at 23:59 on
                Saturday, Sep 9</strong>
        </h6>
        {{/if}}

        <br />
        <div class="quickbites card" style="padding: 20px;">
            <br />
            <h5 class="light-blue-text text-darken-4" style="text-align: left;">Please answer
                the following</h5>
            <br />
            {{#each getTestQuickBites}}
            {{#if isOpenResponse this}}
            <div class="card qmodule cardquestion animated fadeIn">
                <div class="card-content layer-1">
                    <span class="card-title" style="font-size: 19px;">{{this.question}}</span>
                    <textarea id="quickbite-{{this.index}}" class="with-gap materialize-textarea" style="color: black;"
                        type="text" placeholder="Provide a response here" required></textarea>
                    <br />
                    <br />
                </div>
            </div>
            {{else}}
            <div class="card qmodule cardquestion animated fadeIn">
                <div class="card-content layer-1">
                    <span class="card-title" style="font-size: 19px;">{{this.question}}</span>
                    {{#each getOptions this}}
                    <div class="row" style="margin-bottom: 5px;">
                        <div class="col" style="margin-top: 6px;">
                            <input class="with-gap qb{{../index}}-option{{this.option_index}}" name="group-{{../index}}"
                                type="radio" id="qb{{../index}}-option{{this.option_index}}">
                            <label for="qb{{../index}}-option{{this.option_index}}"></label>
                        </div>
                        <div class="col s10" style="padding-top: 5px; padding-bottom: 5px;">
                            <span style="font-size: 12pt; color: #424242;">{{this.option_text}}</span>
                            <div class="feedback" style="text-align: left;">
                                <span id="qb{{../index}}-option{{this.option_index}}-correct"
                                    style="color: #8bc34a; font-size: 12pt; display: none;">Correct</span>
                                <span id="qb{{../index}}-option{{this.option_index}}-incorrect"
                                    style="color: #f44336; font-size: 12pt; display: none;">Incorrect</span>
                            </div>
                            <div id="qb{{../index}}-feedback-{{this.option_index}}"
                                style="text-align: left; font-weight: 800; font-size: 12pt; display: none;">
                                <span id="qb{{../index}}-fb-{{this.option_index}}">{{this.feedback}}</span>
                            </div>
                        </div>
                    </div>
                    {{/each}}
                </div>
            </div>
            {{/if}}
            {{/each}}
            <button class="waves-effect waves-light btn light-blue add-topic-bookmark"
                style="margin-top: 20px; margin-right: 15px;" id="save-quickbites">Save Answers</button>
            <button class="waves-effect waves-light btn light-blue add-topic-bookmark" style="margin-top: 20px;"
                disabled id="next-quickbites">Continue</button>
        </div>

        <div class="mechanisms card" style="padding: 20px; display: none;">
            <br />
            <h5 class="light-blue-text text-darken-4" style="text-align: left;">Guess the
                mechanism</h5>
            <a href="#" id="mechHelp" class="light-blue-text" onclick="$('#mechTip').toggle();">(?)</a>
            <h6 id="mechTip" class="animated fadeIn timestamp"
                style="font-size: 12pt; text-align: left; display: none;">
                <br />
                Explaining how a phenomenon happens is called identifying the mechanism. Guessing possible mechanisms is
                a great way to apply what you know. As a Gut Scientist, you’ll need to guess mechanisms when adding your
                questions, or responding to others’ questions.
                <br />
                <br />
                For example, visiting a new place for a few days might temporarily alter the functioning of your gut.
                One possible mechanism for this: Having a different diet and being in a different environment exposes
                you to different microbes. These microbes can modify how your body digests your food or they can
                communicate with the brain to change how you feel.
                <br />
                <br />
                Scientists have discovered the following facts. How might they be related to the gut microbiome? Guess
                the mechanism!
            </h6>
            <br />
            {{#each getTestMechanisms}}
            <div class="card qmodule cardquestion animated fadeIn">
                <div class="card-content layer-1">
                    <span class="card-title" style="font-size: 19px;">{{this.question}} Identify the <strong>most
                            promising mechanism</strong>:</span>
                    {{#each getOptions this}}
                    <div class="row" style="margin-bottom: 5px;">
                        <div class="col" style="margin-top: 6px;">
                            <input class="with-gap q{{../index}}-option{{this.option_index}}" name="group-{{../index}}"
                                type="radio" id="q{{../index}}-option{{this.option_index}}">
                            <label for="q{{../index}}-option{{this.option_index}}"></label>
                        </div>
                        <div class="col s10" style="padding-top: 5px; padding-bottom: 5px;">
                            <span style="font-size: 12pt; color: #424242;">{{this.option_text}}</span>
                            <div class="feedback" style="text-align: left;">
                                <span id="q{{../index}}-option{{this.option_index}}-correct"
                                    style="color: #8bc34a; font-size: 12pt; display: none;">Correct</span>
                                <span id="q{{../index}}-option{{this.option_index}}-incorrect"
                                    style="color: #f44336; font-size: 12pt; display: none;">Incorrect</span>
                            </div>
                            <div id="q{{../index}}-feedback-{{this.option_index}}"
                                style="text-align: left; font-weight: 800; font-size: 12pt; display: none;">
                                <span id="q{{../index}}-fb-{{this.option_index}}">{{this.feedback}}</span>
                            </div>
                        </div>
                    </div>
                    {{/each}}
                </div>
            </div>
            {{/each}}
            <button class="waves-effect waves-light btn light-blue add-topic-bookmark"
                style="margin-top: 20px; margin-right: 15px;" id="save-mechanisms">Save Answers</button>
            <button class="waves-effect waves-light btn light-blue add-topic-bookmark" style="margin-top: 20px;"
                disabled id="next-mechanisms">Continue</button>
        </div>

        <div class="scenarios card" style="padding: 20px; display: none;">
            <br />
            <h5 class="light-blue-text text-darken-4" style="text-align: left;">Apply your
                current knowledge to real world scenarios</h5>
            <br />
            {{#each getTestScenarios}}
            <div class="card qmodule cardquestion animated fadeIn">
                <div class="card-content layer-1">
                    <span class="card-title" style="font-size: 19px;">{{this.question}}</span>
                    <textarea id="scenarios-{{this.index}}" class="with-gap materialize-textarea" style="color: black;"
                        type="text" placeholder="Provide a response here" required></textarea>
                    <br />
                    <br />
                </div>
            </div>
            {{/each}}
            {{#if isPre type}}
            <button class="waves-effect waves-light btn light-blue add-topic-bookmark" style="margin-top: 20px;"
                id="scenarios-finish">Finish</button>
            {{else}}
            <button class="waves-effect waves-light btn light-blue add-topic-bookmark" style="margin-top: 20px;"
                id="scenarios-finish">Take Survey</button>
            {{/if}}
        </div>
        {{/if}}
    </div>
</template>
